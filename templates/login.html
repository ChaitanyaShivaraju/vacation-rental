<!-- templates/login.html -->
{% extends "base.html" %}

{% block content %}
<div class="section">
    <div class="container">
        <div class="card" style="max-width: 500px; margin: 60px auto; padding: 48px;">
            <div style="text-align: center; margin-bottom: 40px;">
                <div style="font-size: 4rem; margin-bottom: 16px;">👋</div>
                <h2 style="font-size: 2rem; margin-bottom: 8px;">Welcome Back!</h2>
                <p style="color: var(--gray);">Login to continue your journey</p>
            </div>
            
            <form method="POST">
                <div class="form-group">
                    <label>📧 Email</label>
                    <input type="email" name="email" required placeholder="your@email.com">
                </div>
                
                <div class="form-group">
                    <label>🔒 Password</label>
                    <input type="password" name="password" required placeholder="Enter your password">
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 16px;">Login</button>
                
                <p style="text-align: center; color: var(--gray);">
                    Don't have an account? 
                    <a href="/register" style="color: var(--primary); font-weight: 600;">Sign up here</a>
                </p>
            </form>
            
            <div style="margin-top: 32px; padding: 20px; background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%); border-radius: 12px; text-align: center;">
                <p style="font-weight: 600; margin-bottom: 8px;">🎭 Demo Account</p>
                <p style="font-size: 14px; color: var(--gray);">
                    Email: <strong>host@example.com</strong><br>
                    Password: <strong>host123</strong>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
