<!-- templates/register.html -->
{% extends "base.html" %}

{% block content %}
<div class="section">
    <div class="container">
        <div class="card" style="max-width: 600px; margin: 60px auto; padding: 48px;">
            <div style="text-align: center; margin-bottom: 40px;">
                <div style="font-size: 4rem; margin-bottom: 16px;">🏖️</div>
                <h2 style="font-size: 2rem; margin-bottom: 8px;">Welcome to StayNest</h2>
                <p style="color: var(--gray);">Create your account and start exploring</p>
            </div>
            
            <form method="POST">
                <div class="form-group">
                    <label>👤 Username</label>
                    <input type="text" name="username" required placeholder="Choose a username">
                </div>
                
                <div class="form-group">
                    <label>📧 Email</label>
                    <input type="email" name="email" required placeholder="your@email.com">
                </div>
                
                <div class="form-group">
                    <label>📱 Phone</label>
                    <input type="tel" name="phone" placeholder="+1 234 567 8900">
                </div>
                
                <div class="form-group">
                    <label>🔒 Password</label>
                    <input type="password" name="password" required placeholder="Create a secure password">
                </div>
                
                <div class="form-group">
                    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                        <input type="checkbox" name="is_host" style="width: auto;">
                        <span>I want to list my property as a host</span>
                    </label>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-bottom: 16px;">Create Account</button>
                
                <p style="text-align: center; color: var(--gray);">
                    Already have an account? 
                    <a href="/login" style="color: var(--primary); font-weight: 600;">Login here</a>
                </p>
            </form>
        </div>
    </div>
</div>
{% endblock %}
